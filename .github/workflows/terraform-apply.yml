name: Terraform apply

on:
  push:
    branches:
      - main
    paths:
      - terraform/**
      - .github/workflows/terraform-apply.yml
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-2
  TERRAFORM_VERSION: 1.17.1
  TF_IN_AUTOMATION: "1"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  apply:
    if: ${{ vars.TF_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::472750445632:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "472750445632"

      - name: Verify state bucket
        run: |
          case "${TF_STATE_BUCKET}" in
            terraform-state-*) ;;
            *) echo "Invalid TF_STATE_BUCKET"; exit 1 ;;
          esac
          aws s3api get-bucket-tagging --bucket "${TF_STATE_BUCKET}" \
            --query "TagSet[?Key=='ManagedBy'].Value" --output text | grep -qx terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -out=terraform.tfplan

      - name: Publish plan
        working-directory: terraform
        run: |
          terraform show -no-color terraform.tfplan > "$RUNNER_TEMP/plan.txt"
          {
            echo "### Terraform plan"
            echo '```'
            head -n 2000 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve terraform.tfplan
