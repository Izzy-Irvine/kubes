apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: longhorn-system
spec:
  interval: 1m0s
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: v1.10.2
  values:
    persistence:
      defaultClassReplicaCount: 2
    longhornUI:
      replicas: 1
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      storageReservedPercentageForDefaultDisk: 5
      # The 1TB data disks now carry the Immich library (2 replicas) plus the
      # existing volumes, so the sum of requested replica sizes exceeds raw disk
      # size. Allow thin over-commit; actual usage stays well under the disks.
      storageOverProvisioningPercentage: 200
      # Back up detached volumes too (e.g. apps scaled to zero); the daily job
      # would otherwise silently skip them.
      allowRecurringJobWhileVolumeDetached: true
      nodeDownPodDeletionPolicy: delete-deployment-pod
    # Backups go to the raspberrypi NFS share over Tailscale. Longhorn mounts
    # this from its pods via the egress proxy in
    # clusters/clowder/tailscale/egress.yaml; the Pi exports NFSv4.2 on
    # tailscale0 only. See docs/pi-backup.md.
    # Since v1.8 the backup target is configured here (defaultBackupStore)
    # rather than under defaultSettings, which no longer accepts backupTarget.
    defaultBackupStore:
      backupTarget: "nfs://pi-nfs.tailscale.svc.cluster.local:/srv/longhorn-backup?nfsOptions=nfsvers=4.2,actimeo=1,hard,timeo=300,retry=2"
      pollInterval: 300
    ingress:
      enabled: false
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
  interval: 1m0s
---
# Tailnet-only access to the Longhorn UI: https://longhorn.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: longhorn-frontend
      port:
        number: 80
  tls:
    - hosts:
        - longhorn
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: 0 16 * * * # Time is in UTC. This is roughly 4am NST
  groups:
  - default
  labels: {}
  name: daily-backup
  parameters: {}
  retain: 7
  task: backup
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-ephemeral
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  recurringJobSelector: '[{"name":"no-backup", "isGroup":true}]'
