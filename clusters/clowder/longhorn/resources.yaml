apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: longhorn-system
spec:
  interval: 1m0s
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: v1.11.2
  values:
    persistence:
      defaultClassReplicaCount: 2
    longhornUI:
      replicas: 1
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      # Thin-provisioned volumes; actual usage is ~37%. Longhorn's scheduling
      # limit on rusty is otherwise slightly exceeded (scheduled 708GB vs
      # limit 699GB), marking the disk non-schedulable and starving rebuilds.
      storageOverProvisioningPercentage: 120
      # Back up detached volumes too (e.g. apps scaled to zero); the daily job
      # would otherwise silently skip them.
      allowRecurringJobWhileVolumeDetached: true
      nodeDownPodDeletionPolicy: delete-deployment-pod
      # Wait 24h (86400s) before replacing a failed replica with a new one on
      # another node
      replicaReplenishmentWaitInterval: 86400
      # When a node (re)joins the cluster, spread a volume's own replicas
      # evenly across nodes/zones again (cleans up duplicates left behind
      # while a node was offline). This is NOT a cluster-wide load balancer:
      # it does nothing unless a node becomes newly available, and it only
      # balances each volume's replicas, not total replicas per node.
      replicaAutoBalance: best-effort
    # Backups go to the raspberrypi NFS share over Tailscale. Longhorn mounts
    # this from its pods via the egress proxy in
    # clusters/clowder/tailscale/egress.yaml; the Pi exports NFSv4.2 on
    # tailscale0 only. See docs/pi-backup.md.
    # Since v1.8 the backup target is configured here (defaultBackupStore)
    # rather than under defaultSettings, which no longer accepts backupTarget.
    defaultBackupStore:
      backupTarget: "nfs://pi-nfs.tailscale.svc.cluster.local:/srv/longhorn-backup?nfsOptions=nfsvers=4.2,actimeo=1,soft,timeo=300,retry=2"
      pollInterval: 300
    ingress:
      enabled: false
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
  # The Longhorn chart hardcodes staleReplicaTimeout: "30" in the
  # longhorn-storageclass ConfigMap, which the driver-deployer turns into the
  # default `longhorn` StorageClass. Override it to 24h so a replica whose node
  # is briefly down is reused instead of rebuilt
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: longhorn-storageclass
            patch: |-
              - op: replace
                path: /data/storageclass.yaml
                value: |
                  kind: StorageClass
                  apiVersion: storage.k8s.io/v1
                  metadata:
                    name: longhorn
                    annotations:
                      storageclass.kubernetes.io/is-default-class: "true"
                  provisioner: driver.longhorn.io
                  allowVolumeExpansion: true
                  reclaimPolicy: "Delete"
                  volumeBindingMode: Immediate
                  parameters:
                    numberOfReplicas: "2"
                    staleReplicaTimeout: "1440"
                    fromBackup: ""
                    fsType: "ext4"
                    dataLocality: "disabled"
                    unmapMarkSnapChainRemoved: "ignored"
                    disableRevisionCounter: "true"
                    dataEngine: "v1"
                    backupTargetName: "default"
  interval: 1m0s
---
# Tailnet-only access to the Longhorn UI: https://longhorn.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: longhorn-frontend
      port:
        number: 80
  tls:
    - hosts:
        - longhorn
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: 0 16 * * * # Time is in UTC. This is roughly 4am NST
  groups:
  - default
  labels: {}
  name: daily-backup
  parameters: {}
  retain: 7
  task: backup
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-ephemeral
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  # 24h: keep a failed replica's data around long enough to reuse it after a
  # brief node outage instead of rebuilding
  staleReplicaTimeout: "1440"
  fromBackup: ""
  fsType: "ext4"
  recurringJobSelector: '[{"name":"no-backup", "isGroup":true}]'
