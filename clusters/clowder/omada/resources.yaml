apiVersion: v1
kind: Namespace
metadata:
  name: omada
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omada-data
  namespace: omada
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omada-logs
  namespace: omada
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Migrated from omada/docker-compose.yml. Rootless mode per the upstream k8s
# manifest so no privileged entrypoint is needed.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omada-controller
  namespace: omada
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omada-controller
  template:
    metadata:
      labels:
        app: omada-controller
    spec:
      securityContext:
        runAsUser: 508
        runAsGroup: 508
        runAsNonRoot: true
        fsGroup: 508
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Give MongoDB time to shut down cleanly to avoid corruption.
      terminationGracePeriodSeconds: 120
      containers:
        - name: omada-controller
          image: mbentley/omada-controller:6.2.14.11
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ROOTLESS
              value: "true"
            - name: SKIP_USERMOD
              value: "true"
            - name: MANAGE_HTTP_PORT
              value: "8088"
            - name: MANAGE_HTTPS_PORT
              value: "8043"
            - name: PORTAL_HTTP_PORT
              value: "8088"
            - name: PORTAL_HTTPS_PORT
              value: "8843"
            - name: UPGRADE_HTTPS_PORT
              value: "8043"
            - name: PORT_APP_DISCOVERY
              value: "27001"
            - name: PORT_DISCOVERY
              value: "29810"
            - name: PORT_MANAGER_V1
              value: "29811"
            - name: PORT_ADOPT_V1
              value: "29812"
            - name: PORT_UPGRADE_V1
              value: "29813"
            - name: PORT_MANAGER_V2
              value: "29814"
            - name: PORT_TRANSFER_V2
              value: "29815"
            - name: PORT_RTTY
              value: "29816"
            - name: PORT_DEVICE_MONITOR
              value: "29817"
            - name: WEB_CONFIG_OVERRIDE
              value: "false"
            - name: SHOW_SERVER_LOGS
              value: "true"
            - name: SHOW_MONGODB_LOGS
              value: "false"
            - name: SSL_CERT_NAME
              value: tls.crt
            - name: SSL_KEY_NAME
              value: tls.key
            - name: TZ
              value: Etc/UTC
          ports:
            - name: manage-http
              containerPort: 8088
              protocol: TCP
            - name: manage-https
              containerPort: 8043
              protocol: TCP
            - name: portal-https
              containerPort: 8843
              protocol: TCP
            - name: app-discovery
              containerPort: 27001
              protocol: UDP
            - name: discovery
              containerPort: 29810
              protocol: UDP
            - name: management-udp
              containerPort: 19810
              protocol: UDP
            - name: manager-v1
              containerPort: 29811
              protocol: TCP
            - name: adopt-v1
              containerPort: 29812
              protocol: TCP
            - name: upgrade-v1
              containerPort: 29813
              protocol: TCP
            - name: manager-v2
              containerPort: 29814
              protocol: TCP
            - name: transfer-v2
              containerPort: 29815
              protocol: TCP
            - name: rtty
              containerPort: 29816
              protocol: TCP
            - name: device-monitor
              containerPort: 29817
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/tplink/EAPController/data
            - name: logs
              mountPath: /opt/tplink/EAPController/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omada-data
        - name: logs
          persistentVolumeClaim:
            claimName: omada-logs
---
# 192.168.100.10 is the address devices were adopted against. It lives on the
# "Izzy's k8s" L2 so Cilium can L2-announce it; the block is added to the
# default CiliumLoadBalancerIPPool.
apiVersion: v1
kind: Service
metadata:
  name: omada
  namespace: omada
  annotations:
    lbipam.cilium.io/ips: "192.168.100.10"
spec:
  type: LoadBalancer
  selector:
    app: omada-controller
  ports:
    - name: manage-http
      port: 8088
      targetPort: 8088
      protocol: TCP
    - name: manage-https
      port: 8043
      targetPort: 8043
      protocol: TCP
    - name: portal-https
      port: 8843
      targetPort: 8843
      protocol: TCP
    - name: app-discovery
      port: 27001
      targetPort: 27001
      protocol: UDP
    - name: discovery
      port: 29810
      targetPort: 29810
      protocol: UDP
    - name: management-udp
      port: 19810
      targetPort: 19810
      protocol: UDP
    - name: manager-v1
      port: 29811
      targetPort: 29811
      protocol: TCP
    - name: adopt-v1
      port: 29812
      targetPort: 29812
      protocol: TCP
    - name: upgrade-v1
      port: 29813
      targetPort: 29813
      protocol: TCP
    - name: manager-v2
      port: 29814
      targetPort: 29814
      protocol: TCP
    - name: transfer-v2
      port: 29815
      targetPort: 29815
      protocol: TCP
    - name: rtty
      port: 29816
      targetPort: 29816
      protocol: TCP
    - name: device-monitor
      port: 29817
      targetPort: 29817
      protocol: TCP
---
# Tailnet-only access to the controller: https://omada.<tailnet>.ts.net
# Plain HTTP backend avoids the controller's self-signed certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omada
  namespace: omada
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: omada
      port:
        number: 8088
  tls:
    - hosts:
        - omada
