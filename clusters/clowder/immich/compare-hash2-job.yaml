apiVersion: batch/v1
kind: Job
metadata:
  name: immich-compare-hash2
  namespace: immich
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: immich-compare-hash2
    spec:
      restartPolicy: Never
      containers:
        - name: hash
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache python3 ca-certificates curl unzip >/dev/null
              curl -fsSL -o /tmp/rclone.zip "https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip"
              echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  /tmp/rclone.zip" | sha256sum -c -
              unzip -q /tmp/rclone.zip -d /tmp
              install -m 0755 /tmp/rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone
              cp /config/rclone/rclone.conf /tmp/rclone.conf
              export RCLONE_CONFIG=/tmp/rclone.conf
              rclone serve http "$GDRIVE_PATH" --addr 127.0.0.1:8080 --read-only --log-level ERROR &
              for i in $(seq 1 30); do
                if curl -fsS -o /dev/null "http://127.0.0.1:8080/" 2>/dev/null; then break; fi
                sleep 2
              done
              python3 - <<'PY'
              import io, sys, json, time, hashlib, threading, zipfile, urllib.request, urllib.parse
              from collections import defaultdict
              from concurrent.futures import ThreadPoolExecutor

              class RangeFile(io.RawIOBase):
                  def __init__(self, url, size):
                      self.url = url
                      self.size = size
                      self.pos = 0
                  def readable(self):
                      return True
                  def seekable(self):
                      return True
                  def tell(self):
                      return self.pos
                  def seek(self, offset, whence=0):
                      if whence == 0:
                          self.pos = offset
                      elif whence == 1:
                          self.pos += offset
                      elif whence == 2:
                          self.pos = self.size + offset
                      return self.pos
                  def readinto(self, b):
                      n = len(b)
                      if self.pos >= self.size:
                          return 0
                      end = min(self.pos + n, self.size) - 1
                      last = None
                      for attempt in range(6):
                          try:
                              req = urllib.request.Request(self.url, headers={"Range": "bytes=%d-%d" % (self.pos, end)})
                              with urllib.request.urlopen(req, timeout=180) as r:
                                  data = r.read()
                              break
                          except Exception as e:
                              last = e
                              time.sleep(2 * (attempt + 1))
                      else:
                          raise last
                      b[:len(data)] = data
                      self.pos += len(data)
                      return len(data)

              rows = [l.rstrip("\n").split("\t") for l in open("/candidates/candidates.tsv") if l.strip()]
              byzip = defaultdict(list)
              for r in rows:
                  byzip[r[2]].append(r)

              sizes = {}
              for z in byzip:
                  h = urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8080/" + urllib.parse.quote(z), method="HEAD"), timeout=60)
                  sizes[z] = int(h.headers["Content-Length"])

              lock = threading.Lock()
              def process(z, items):
                  zf = zipfile.ZipFile(RangeFile("http://127.0.0.1:8080/" + urllib.parse.quote(z), sizes[z]))
                  done = 0
                  for label, name, _, path in items:
                      try:
                          data = zf.read(path)
                          sha1 = hashlib.sha1(data).hexdigest()
                      except Exception as e:
                          with lock:
                              print("ERR\t%s\t%s\t%s" % (label, name, e), file=sys.stderr)
                          continue
                      with lock:
                          print("%s\t%s\t%s\t%s" % (label, name, sha1, z))
                          sys.stdout.flush()
                      done += 1
                      if done % 20 == 0:
                          with lock:
                              print("progress %s %d/%d" % (z, done, len(items)), file=sys.stderr)
                              sys.stderr.flush()

              with ThreadPoolExecutor(max_workers=min(len(byzip), 9)) as ex:
                  futures = [ex.submit(process, z, items) for z, items in byzip.items()]
                  for f in futures:
                      f.result()
              PY
          env:
            - name: GDRIVE_PATH
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: drive-path
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: candidates
              mountPath: /candidates
              readOnly: true
      volumes:
        - name: rclone-config
          secret:
            secretName: immich-migrate
            items:
              - key: rclone.conf
                path: rclone.conf
        - name: tmp
          emptyDir: {}
        - name: candidates
          configMap:
            name: immich-compare-candidates
            items:
              - key: candidates.tsv
                path: candidates.tsv
