apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: immich
spec:
  interval: 12h
  type: oci
  url: oci://ghcr.io/immich-app/immich-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: 0.13.2
      sourceRef:
        kind: HelmRepository
        name: immich
  values:
    # Applied to every component; the server and machine-learning images are
    # moved together on upgrade.
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.2.2
    immich:
      # Prometheus metrics on the server (ports 8081/8082); Alloy scrapes the
      # generated ServiceMonitor via the k8s-monitoring prometheusOperatorObjects.
      metrics:
        enabled: true
      # Mounted at /data: thumbnails, encoded video, profile, uploads, backups.
      persistence:
        library:
          existingClaim: immich-data
    server:
      route:
        main:
          enabled: true
          kind: HTTPRoute
          parentRefs:
            - name: public
              namespace: ingress
          hostnames:
            - photos.izzy.kiwi
      persistence:
        # Originals, mounted over /data/library from their own volume.
        library:
          enabled: true
          existingClaim: immich-media
          globalMounts:
            - path: /data/library
      controllers:
        main:
          # RWO volumes cannot be attached to two pods at once.
          strategy: Recreate
          containers:
            main:
              env:
                DB_HOSTNAME: immich-postgres
                DB_USERNAME: immich
                DB_DATABASE_NAME: immich
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: password
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  memory: 4Gi
    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache
      controllers:
        main:
          # RWO volumes cannot be attached to two pods at once.
          strategy: Recreate
          containers:
            main:
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  memory: 4Gi
    valkey:
      enabled: true
