apiVersion: batch/v1
kind: Job
metadata:
  name: immich-compare
  namespace: immich
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: immich-compare
    spec:
      restartPolicy: Never
      containers:
        - name: compare
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache python3 ca-certificates curl unzip >/dev/null
              curl -fsSL -o /tmp/rclone.zip "https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip"
              echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  /tmp/rclone.zip" | sha256sum -c -
              unzip -q /tmp/rclone.zip -d /tmp
              install -m 0755 /tmp/rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone
              cp /config/rclone/rclone.conf /tmp/rclone.conf
              export RCLONE_CONFIG=/tmp/rclone.conf
              rclone serve http "$GDRIVE_PATH" --addr 127.0.0.1:8080 --read-only --log-level ERROR &
              for i in $(seq 1 30); do
                if curl -fsS -o /dev/null "http://127.0.0.1:8080/" 2>/dev/null; then break; fi
                sleep 2
              done
              python3 - <<'PY'
              import os, io, sys, json, time, zipfile, subprocess, urllib.request, urllib.parse

              base = os.environ["GDRIVE_PATH"]
              ls = json.loads(subprocess.run(["rclone", "lsjson", base], capture_output=True, check=True).stdout)
              zips = [e for e in ls if e["Name"].endswith(".zip")]

              IMG = set("jpg jpeg png heic heif webp gif bmp tif tiff dng arw cr2 rw2 raf nef orf srw".split())
              VID = set("mp4 mov 3gp mkv webm m4v avi".split())

              class RangeFile(io.RawIOBase):
                  def __init__(self, url, size):
                      self.url = url
                      self.size = size
                      self.pos = 0
                  def readable(self):
                      return True
                  def seekable(self):
                      return True
                  def tell(self):
                      return self.pos
                  def seek(self, offset, whence=0):
                      if whence == 0:
                          self.pos = offset
                      elif whence == 1:
                          self.pos += offset
                      elif whence == 2:
                          self.pos = self.size + offset
                      return self.pos
                  def readinto(self, b):
                      n = len(b)
                      if self.pos >= self.size:
                          return 0
                      end = min(self.pos + n, self.size) - 1
                      last = None
                      for attempt in range(5):
                          try:
                              req = urllib.request.Request(self.url, headers={"Range": "bytes=%d-%d" % (self.pos, end)})
                              with urllib.request.urlopen(req, timeout=120) as r:
                                  data = r.read()
                              break
                          except Exception as e:
                              last = e
                              time.sleep(2 * (attempt + 1))
                      else:
                          raise last
                      b[:len(data)] = data
                      self.pos += len(data)
                      return len(data)

              for z in sorted(zips, key=lambda e: e["Name"]):
                  url = "http://127.0.0.1:8080/" + urllib.parse.quote(z["Name"])
                  with zipfile.ZipFile(RangeFile(url, z["Size"])) as zf:
                      for n in zf.namelist():
                          base_name = os.path.basename(n)
                          if "." not in base_name:
                              continue
                          ext = base_name.lower().rsplit(".", 1)[-1]
                          if ext in IMG:
                              print("IMG\t%s\t%s" % (z["Name"], n))
                          elif ext in VID:
                              print("VID\t%s\t%s" % (z["Name"], n))
                  print("DONE\t%s" % z["Name"], file=sys.stderr)
              PY
          env:
            - name: GDRIVE_PATH
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: drive-path
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: rclone-config
          secret:
            secretName: immich-migrate
            items:
              - key: rclone.conf
                path: rclone.conf
        - name: tmp
          emptyDir: {}
