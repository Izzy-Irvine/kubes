# One-off Google Takeout -> Immich migration.
#
# Both the download and the upload happen in-cluster (no hairpin through a
# workstation). The Job is suspended until the `immich-migrate` Secret holds a
# real API key, browser Cookie header, and Takeout URLs; then flip `suspend`.
#
# To keep the staging volume small, it processes one Takeout part at a time:
#   download part -> immich-go upload -> delete part -> mark done -> next.
# Progress markers live on the staging volume, so a pod restart skips parts
# already processed.
#
# Takeout download URLs require your Google session; the Cookie header from
# your logged-in browser is sent with each request.
#
# Delete this file (plus migrate-pvc.yaml and migrate-secret.k8s-sops.yaml) when
# finished so Flux prunes the staging volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-migrate
  namespace: immich
spec:
  suspend: true
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: immich-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl ca-certificates tar unzip

              cd /tmp
              curl -fsSL -o immich-go.tgz \
                "https://github.com/simulot/immich-go/releases/download/v0.32.0/immich-go_Linux_x86_64.tar.gz"
              echo "6e2ad86bafdadb9466d6515de7cb882726c0aea1a21d51164dff361d7d480a97  immich-go.tgz" | sha256sum -c -
              tar xzf immich-go.tgz

              cd /takeout
              mkdir -p state
              n=0
              printf '%s\n' "$TAKEOUT_URLS" | while IFS= read -r url; do
                if [ -z "$url" ]; then continue; fi
                n=$((n + 1))
                if [ -f "state/done-$n" ]; then
                  echo "==> part $n already done, skipping"
                  continue
                fi
                part=$(printf 'part-%03d.zip' "$n")
                # Takeout file URLs reject HTTP Range, so no resume: each attempt
                # is a full download, verified end-to-end, retried on truncation.
                ok=0
                for attempt in 1 2 3; do
                  rm -f "$part"
                  echo "==> part $n: downloading (attempt $attempt)"
                  if curl -fSL --retry 8 --retry-delay 15 --retry-all-errors \
                       --cookie "$TAKEOUT_COOKIE" -A "Mozilla/5.0" -o "$part" "$url" \
                     && unzip -t "$part" >/dev/null 2>&1; then
                    ok=1
                    break
                  fi
                  echo "==> part $n: attempt $attempt incomplete/unreadable, retrying" >&2
                done
                if [ "$ok" != 1 ]; then
                  echo "ERROR: part $n failed after 3 attempts (expired cookie/URL?)" >&2
                  exit 1
                fi
                echo "==> part $n: uploading"
                /tmp/immich-go upload from-google-photos \
                  --server=http://immich-server:2283 \
                  --api-key="$IMMICH_API_KEY" \
                  --concurrent-tasks=4 \
                  --client-timeout=60m \
                  --pause-immich-jobs=true \
                  --on-errors=continue \
                  --tag="Migration/GooglePhotos" \
                  "$part"
                rm -f "$part"
                touch "state/done-$n"
                echo "==> part $n: done"
              done
              echo "==> migration complete"
          env:
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: api-key
            - name: TAKEOUT_COOKIE
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: cookie
            - name: TAKEOUT_URLS
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: takeout-urls
          volumeMounts:
            - name: takeout
              mountPath: /takeout
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: takeout
          persistentVolumeClaim:
            claimName: immich-takeout
