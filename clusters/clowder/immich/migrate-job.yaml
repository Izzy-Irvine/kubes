# One-off Google Takeout -> Immich migration (single-pass re-run).
#
# Takeout was delivered to Google Drive; rclone stages ALL parts, then immich-go
# runs once over every zip. This matters because Google Takeout can put a photo
# and its .supplemental-metadata.json sidecar in different zip parts, so a
# per-part run loses metadata/albums (and without --include-unmatched, skips
# photos entirely).
#
# Uploads dedup against the server, so already-imported assets are not re-sent.
# Suspended until the staging volume is expanded to 550Gi, then flip `suspend`.
#
# Delete this file (plus migrate-pvc.yaml and migrate-secret.k8s-sops.yaml) when
# finished so Flux prunes the staging volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-migrate
  namespace: immich
spec:
  suspend: true
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: immich-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl ca-certificates tar unzip

              cd /tmp
              curl -fsSL -o rclone.zip \
                "https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip"
              echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone.zip" | sha256sum -c -
              unzip -q rclone.zip
              install -m 0755 rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone

              curl -fsSL -o immich-go.tgz \
                "https://github.com/simulot/immich-go/releases/download/v0.32.0/immich-go_Linux_x86_64.tar.gz"
              echo "6e2ad86bafdadb9466d6515de7cb882726c0aea1a21d51164dff361d7d480a97  immich-go.tgz" | sha256sum -c -
              tar xzf immich-go.tgz -C /usr/local/bin immich-go
              chmod +x /usr/local/bin/immich-go

              export RCLONE_CONFIG=/config/rclone/rclone.conf
              export XDG_CACHE_HOME=/tmp

              cd /takeout
              rm -f ./*.partial ./*.zip
              rm -rf state

              # Stage every part.
              rclone lsf --files-only "$GDRIVE_PATH" | grep -E '\.zip$' | sort | while IFS= read -r name; do
                echo "==> staging $name"
                rclone copy "$GDRIVE_PATH/$name" /takeout/ \
                  --retries 10 --low-level-retries 20 --contimeout 60s --timeout 5m \
                  --drive-chunk-size 128M --multi-thread-streams 4 --transfers 1 \
                  --stats 30s --stats-one-line
                src_md5=$(rclone md5sum "$GDRIVE_PATH/$name" | awk '{print $1}')
                loc_md5=$(md5sum "/takeout/$name" | awk '{print $1}')
                if [ -z "$src_md5" ] || [ "$src_md5" != "$loc_md5" ]; then
                  echo "ERROR: MD5 mismatch for $name (src=$src_md5 local=$loc_md5)" >&2
                  exit 1
                fi
                echo "==> staged $name"
              done
              ls -lh /takeout

              # Single-pass import over all parts. --include-unmatched imports
              # photos whose sidecar is absent/elsewhere; --include-untitled-albums
              # keeps albums without album metadata.
              echo "==> importing"
              /usr/local/bin/immich-go upload from-google-photos \
                --server=http://immich-server:2283 \
                --api-key="$IMMICH_API_KEY" \
                --concurrent-tasks=4 \
                --client-timeout=60m \
                --pause-immich-jobs=true \
                --on-errors=continue \
                --include-unmatched \
                --include-untitled-albums \
                --tag="Migration/GooglePhotos" \
                /takeout/takeout-*.zip
              echo "==> migration complete"
          env:
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: api-key
            - name: GDRIVE_PATH
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: drive-path
          volumeMounts:
            - name: takeout
              mountPath: /takeout
            - name: rclone-config
              mountPath: /config/rclone
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: takeout
          persistentVolumeClaim:
            claimName: immich-takeout
        - name: rclone-config
          secret:
            secretName: immich-migrate
            items:
              - key: rclone.conf
                path: rclone.conf
