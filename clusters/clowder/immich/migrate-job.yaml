# One-off Google Takeout -> Immich migration.
#
# Both the download and the upload happen in-cluster. The Takeout was delivered
# to Google Drive, and rclone copies it from there (resumable, unlike the direct
# Takeout download links which reject HTTP Range).
#
# To keep the staging volume small, it processes one Takeout part at a time:
#   rclone copy part -> immich-go upload -> delete part -> mark done -> next.
# Progress markers live on the staging volume, so a pod restart skips parts
# already processed.
#
# The Job is suspended until the `immich-migrate` Secret holds a real API key,
# an rclone config for the Drive remote, and the Drive path; then flip `suspend`.
#
# Delete this file (plus migrate-pvc.yaml and migrate-secret.k8s-sops.yaml) when
# finished so Flux prunes the staging volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-migrate
  namespace: immich
spec:
  suspend: false
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: immich-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl ca-certificates tar unzip

              cd /tmp
              # Alpine's packaged rclone is old; use a current release.
              curl -fsSL -o rclone.zip \
                "https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip"
              echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone.zip" | sha256sum -c -
              unzip -q rclone.zip
              install -m 0755 rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone

              curl -fsSL -o immich-go.tgz \
                "https://github.com/simulot/immich-go/releases/download/v0.32.0/immich-go_Linux_x86_64.tar.gz"
              echo "6e2ad86bafdadb9466d6515de7cb882726c0aea1a21d51164dff361d7d480a97  immich-go.tgz" | sha256sum -c -
              # Install the binary outside /tmp: XDG_CACHE_HOME=/tmp makes
              # immich-go use /tmp/immich-go as its cache dir.
              tar xzf immich-go.tgz -C /usr/local/bin immich-go
              chmod +x /usr/local/bin/immich-go

              export RCLONE_CONFIG=/config/rclone/rclone.conf
              export XDG_CACHE_HOME=/tmp

              cd /takeout
              mkdir -p state
              # GDRIVE_PATH points directly at the folder containing the
              # takeout-*.zip parts, e.g. "gdrive:Takeout".
              rclone lsf --files-only "$GDRIVE_PATH" | grep -E '\.zip$' | sort | while IFS= read -r name; do
                if [ -f "state/done-$name" ]; then
                  echo "==> $name already done, skipping"
                  continue
                fi
                ok=0
                for attempt in 1 2 3; do
                  echo "==> $name: rclone (attempt $attempt)"
                  if rclone copy "$GDRIVE_PATH/$name" /takeout/ \
                       --retries 10 --low-level-retries 20 --contimeout 60s --timeout 5m \
                       --drive-chunk-size 128M --multi-thread-streams 4 --transfers 1 \
                       --stats 15s --stats-one-line; then
                    # Exact content check against the MD5 Drive stores.
                    src_md5=$(rclone md5sum "$GDRIVE_PATH/$name" | awk '{print $1}')
                    loc_md5=$(md5sum "/takeout/$name" | awk '{print $1}')
                    echo "==> $name: md5 src=${src_md5:-none} local=$loc_md5"
                    if [ -n "$src_md5" ] && [ "$src_md5" = "$loc_md5" ]; then
                      ok=1
                      break
                    fi
                    echo "==> $name: checksum mismatch, retrying" >&2
                  else
                    echo "==> $name: rclone copy failed, retrying" >&2
                  fi
                  rm -f "/takeout/$name"
                  sleep 10
                done
                if [ "$ok" != 1 ]; then
                  echo "ERROR: $name failed after 3 attempts" >&2
                  exit 1
                fi
                echo "==> $name: uploading"
                /usr/local/bin/immich-go upload from-google-photos \
                  --server=http://immich-server:2283 \
                  --api-key="$IMMICH_API_KEY" \
                  --concurrent-tasks=4 \
                  --client-timeout=60m \
                  --pause-immich-jobs=true \
                  --on-errors=continue \
                  --tag="Migration/GooglePhotos" \
                  "/takeout/$name"
                rm -f "/takeout/$name"
                touch "state/done-$name"
                echo "==> $name: done"
              done
              echo "==> migration complete"
          env:
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: api-key
            - name: GDRIVE_PATH
              valueFrom:
                secretKeyRef:
                  name: immich-migrate
                  key: drive-path
          volumeMounts:
            - name: takeout
              mountPath: /takeout
            - name: rclone-config
              mountPath: /config/rclone
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: takeout
          persistentVolumeClaim:
            claimName: immich-takeout
        - name: rclone-config
          secret:
            secretName: immich-migrate
            items:
              - key: rclone.conf
                path: rclone.conf
