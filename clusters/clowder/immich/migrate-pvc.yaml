# Scratch space for the Google Takeout migration. Holds all ~504GiB of Takeout
# parts at once so immich-go can run in a single pass (sidecars and media can
# land in different zip parts). 1-replica longhorn-ephemeral. Delete once the
# migration is done.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-takeout
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ephemeral
  resources:
    requests:
      storage: 550Gi
