# Takeout staging, bound to the static local PV on leo's ZFS pool.
# Delete this file (and migrate-pv.yaml) once the migration is done.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-takeout
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: immich-takeout-leo
  resources:
    requests:
      storage: 550Gi
