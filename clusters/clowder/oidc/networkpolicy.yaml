---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oidc
  namespace: oidc
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oidc
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: cilium-envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
