---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oidc
  namespace: oidc
spec:
  parentRefs:
    - name: public
      namespace: ingress
  hostnames:
    - oidc.izzy.kiwi
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/openid-configuration
          method: GET
      backendRefs:
        - name: oidc
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /openid/v1/jwks
          method: GET
      backendRefs:
        - name: oidc
          port: 8080
