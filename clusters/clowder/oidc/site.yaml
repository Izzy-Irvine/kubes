---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-nginx
  namespace: oidc
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /.well-known/openid-configuration {
            default_type application/json;
            try_files $uri =404;
        }

        location = /openid/v1/jwks {
            default_type application/json;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc
  namespace: oidc
  labels:
    app.kubernetes.io/name: oidc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oidc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oidc
    spec:
      serviceAccountName: oidc
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: oidc
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /openid/v1/jwks
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openid/v1/jwks
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: site
          configMap:
            name: oidc-site
            items:
              - key: openid-configuration
                path: .well-known/openid-configuration
              - key: jwks
                path: openid/v1/jwks
        - name: nginx-conf
          configMap:
            name: oidc-nginx
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oidc
  namespace: oidc
spec:
  selector:
    app.kubernetes.io/name: oidc
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oidc
  namespace: oidc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oidc
