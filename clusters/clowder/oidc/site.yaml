---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc
  namespace: oidc
automountServiceAccountToken: false
---
# If this JWKS goes out of date (service-account signing key rotated or cluster
# rebuilt), refresh it from the live cluster:
#
#   kubectl get --raw /openid/v1/jwks | jq -S .
#
# Replace the `jwks` value below with that output and apply this manifest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-site
  namespace: oidc
data:
  openid-configuration: |
    {
      "issuer": "https://oidc.izzy.kiwi",
      "jwks_uri": "https://oidc.izzy.kiwi/openid/v1/jwks",
      "response_types_supported": ["id_token"],
      "subject_types_supported": ["public"],
      "id_token_signing_alg_values_supported": ["RS256"]
    }
  jwks: |
    {
      "keys": [
        {
          "use": "sig",
          "kty": "RSA",
          "kid": "8TndhKu642adF42ulJ2Hx3jlbwfZMVuLh3-b0z5aNmo",
          "alg": "RS256",
          "n": "1sEkpdJsFcoM0Gs-cSflldmzIcbtudLG2KCk8lRkRKzLATXrxA2udiZaGS-eqgC-oG8R9g8_I7w91GLIXBKhaNsJiFJdQ63cGalEzPWX219qRQY3lrK_SeZRJkjyit6E2STMthcC2qpfGX_SNwKSjbHGeE9rbx9jBT5Y4oMR0wF-8CGBjBA6RuPMxKt62P9iedJ7v_V9lO_63cGx-VHCNeYqK4smQfPlcG71QUClttZqeIcYp6IZep00SqUB8V6G-hyR6ZQIkDlADtl2v8nD9hSVq9OUBz4n0u2-6L0dyqxEBh45a22mPJHYyzQ0By5j-LcY-MRy2qsoSB7D9Y3iGsmBKjQM_fXLTw6bxnaYIbOCieYuGNOs65qnqv19IL7erElM6CwVfEv-B_5NWtFztsFJjVHBLvSKH5rGN71IbyDBVZLw6ihsrioLo-7zUCkiIGcE0IYzeFSV0uBZEW4VzXke1xoktu6uZo5W2fB9yxxaD3SOcNpUzqwtV0kI33AfMczoEwdxj4a6DDTzlcReyFJ6F6vUf8NRSIL1ZfTWErkavZVeqfxc-jNupiyVYFvD5umZKHH3JeTrT756B4GoEbRTTCo5m6MNu20WPs7s_eZIl7_Yp5FKw4bGzOpFqK7i0njoVTpikP8rzmAFvKgZhgf5Y5UaQPr1XhE_efrUS1E",
