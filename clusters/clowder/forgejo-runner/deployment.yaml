apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuhaha-runner
  namespace: forgejo-runner
  labels:
    app.kubernetes.io/name: tuhaha-runner
spec:
  replicas: 1
  # One runner per registration.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: tuhaha-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuhaha-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: runner
          # The image also runs the jobs (host executor), so it includes
          # forgejo-runner, Nix, OpenTofu and the other CI tools.
          image: ghcr.io/izzy-irvine/tuhaha-ci:latest
          imagePullPolicy: IfNotPresent
          command:
            - forgejo-runner
            - daemon
            - --config
            - /etc/forgejo-runner/config.yml
          env:
            - name: HOME
              value: /root
          volumeMounts:
            - name: config
              mountPath: /etc/forgejo-runner
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: workspace
              mountPath: /workspace
          # Nix needs root to populate /nix/store in this container. The pod is
          # unprivileged and confined by baseline Pod Security.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            exec:
              command: ["forgejo-runner", "--version"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["forgejo-runner", "--version"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "8"
              memory: 12Gi
              ephemeral-storage: 60Gi
      volumes:
        - name: config
          secret:
            secretName: tuhaha-runner-config
            items:
              - key: config.yml
                path: config.yml
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: workspace
          emptyDir:
            sizeLimit: 50Gi
