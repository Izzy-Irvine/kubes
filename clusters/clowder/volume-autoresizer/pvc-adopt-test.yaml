apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-autoresizer-adopt-test
  namespace: volume-autoresizer
  labels:
    longhorn-autoresize: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ephemeral
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-autoresizer-adopt-test-mount
  namespace: volume-autoresizer
  labels:
    app: volume-autoresizer-adopt-test-mount
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: mount
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - df -P /data && sleep 86400
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: volume-autoresizer-adopt-test
