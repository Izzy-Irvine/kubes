apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-autoresizer-test
  namespace: volume-autoresizer
  labels:
    longhorn-autoresize: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ephemeral
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: volume-autoresizer-test-fill-v3
  namespace: volume-autoresizer
  labels:
    app: volume-autoresizer-test-fill-v3
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: volume-autoresizer-test-fill-v3
    spec:
      restartPolicy: Never
      containers:
        - name: fill
          image: alpine:3.22
          command:
            - /bin/sh
            - -c
            - i=0; while [ $i -lt 46 ]; do dd if=/dev/zero of=/data/fill bs=1M count=100 conv=fsync || exit 1; i=$((i+1)); done; sleep 86400
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: volume-autoresizer-test
