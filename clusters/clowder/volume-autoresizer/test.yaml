apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-autoresizer-test
  namespace: volume-autoresizer
  labels:
    longhorn-autoresize: "true"
  annotations:
    longhorn-autoresize/var: PVC_VOLUME_AUTORESIZER_TEST_SIZE
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ephemeral
  resources:
    requests:
      storage: ${PVC_VOLUME_AUTORESIZER_TEST_SIZE:=5Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: volume-autoresizer-test-fill
  namespace: volume-autoresizer
  labels:
    app: volume-autoresizer-test-fill
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: volume-autoresizer-test-fill
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fill
          image: alpine:3.22
          command:
            - /bin/sh
            - -c
            - i=0; while [ $i -lt 46 ]; do dd if=/dev/zero of=/data/fill.$i bs=1M count=100 conv=fsync || exit 1; i=$((i+1)); done; sleep 86400
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: volume-autoresizer-test
