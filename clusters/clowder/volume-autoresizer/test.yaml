apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-autoresizer-test
  namespace: volume-autoresizer
  labels:
    longhorn-autoresize: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ephemeral
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-autoresizer-test-fill
  namespace: volume-autoresizer
  labels:
    app: volume-autoresizer-test-fill
spec:
  restartPolicy: Never
  containers:
    - name: fill
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - dd if=/dev/zero of=/data/fill bs=1M count=4600 status=progress && sync && sleep 86400
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: volume-autoresizer-test
