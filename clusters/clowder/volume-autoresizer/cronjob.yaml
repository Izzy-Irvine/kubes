apiVersion: batch/v1
kind: CronJob
metadata:
  name: volume-autoresizer
  namespace: volume-autoresizer
spec:
  schedule: "0 */4 * * *"
  timeZone: "Pacific/Auckland"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: volume-autoresizer
        spec:
          serviceAccountName: volume-autoresizer
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: volume-autoresizer
              image: alpine/k8s:1.35.9
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - /config/resize.sh
              env:
                - name: HOME
                  value: /tmp
                - name: PROMETHEUS_URL
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: PROMETHEUS_URL
                - name: LABEL_SELECTOR
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: LABEL_SELECTOR
                - name: MAX_SIZE_GIB
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: MAX_SIZE_GIB
                - name: THRESHOLD_PERCENT
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: THRESHOLD_PERCENT
                - name: TARGET_PERCENT
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: TARGET_PERCENT
                - name: COOLDOWN_SECONDS
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: COOLDOWN_SECONDS
                - name: MAX_OVERHEAD_RATIO
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: MAX_OVERHEAD_RATIO
                - name: DRY_RUN
                  valueFrom:
                    configMapKeyRef:
                      name: volume-autoresizer
                      key: DRY_RUN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: volume-autoresizer
                items:
                  - key: resize.sh
                    path: resize.sh
            - name: tmp
              emptyDir: {}
