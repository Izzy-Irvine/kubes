apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-autoresizer
  namespace: volume-autoresizer
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  PROMETHEUS_URL: "http://prometheus-server.monitoring.svc.cluster.local/api/v1/query"
  LABEL_SELECTOR: "longhorn-autoresize=true"
  MAX_SIZE_GIB: "500"
  THRESHOLD_PERCENT: "85"
  TARGET_PERCENT: "80"
  MAX_OVERHEAD_RATIO: "1.10"
  DRY_RUN: "false"
  SIZES_CONFIGMAP_NAMESPACE: "flux-system"
  SIZES_CONFIGMAP_NAME: "volume-autoresizer-sizes"
  resize.sh: |
    #!/usr/bin/env bash
    set -uo pipefail

    PROMETHEUS_URL="${PROMETHEUS_URL:-http://prometheus-server.monitoring.svc.cluster.local/api/v1/query}"
    LABEL_SELECTOR="${LABEL_SELECTOR:-longhorn-autoresize=true}"
    MAX_SIZE_GIB="${MAX_SIZE_GIB:-500}"
    THRESHOLD_PERCENT="${THRESHOLD_PERCENT:-85}"
    TARGET_PERCENT="${TARGET_PERCENT:-80}"
    MAX_OVERHEAD_RATIO="${MAX_OVERHEAD_RATIO:-1.10}"
    DRY_RUN="${DRY_RUN:-false}"
    SIZES_CONFIGMAP_NAMESPACE="${SIZES_CONFIGMAP_NAMESPACE:-flux-system}"
    SIZES_CONFIGMAP_NAME="${SIZES_CONFIGMAP_NAME:-volume-autoresizer-sizes}"

    GIB=1073741824
    FAILED=0

    log() {
        printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"
    }

    error() {
        log "ERROR: $*" >&2
        FAILED=1
    }

    for var in MAX_SIZE_GIB THRESHOLD_PERCENT TARGET_PERCENT; do
        if ! [[ "${!var}" =~ ^[0-9]+$ ]]; then
            log "ERROR: $var must be an integer, got '${!var}'" >&2
            exit 1
        fi
    done
    if (( TARGET_PERCENT <= 0 || TARGET_PERCENT >= THRESHOLD_PERCENT )); then
        log "ERROR: TARGET_PERCENT must be >0 and below THRESHOLD_PERCENT" >&2
        exit 1
    fi
    if ! awk -v m="$MAX_OVERHEAD_RATIO" 'BEGIN { exit !(m > 0) }'; then
        log "ERROR: MAX_OVERHEAD_RATIO must be a positive number, got '$MAX_OVERHEAD_RATIO'" >&2
        exit 1
    fi

    quantity_to_bytes() {
        local q="$1" num unit mult
        num="${q%%[!0-9.]*}"
        unit="${q#"$num"}"
        if [[ -z "$num" ]]; then
            error "unparseable quantity: $q"
            return 1
        fi
        case "$unit" in
            "") mult=1 ;;
            k|K) mult=1000 ;;
            M) mult=1000000 ;;
            G) mult=1000000000 ;;
            T) mult=1000000000000 ;;
            Ki) mult=1024 ;;
            Mi) mult=1048576 ;;
            Gi) mult=1073741824 ;;
            Ti) mult=1099511627776 ;;
            *)
                error "unsupported quantity unit '$unit' in $q"
                return 1
                ;;
        esac
        awk -v n="$num" -v m="$mult" 'BEGIN { printf "%.0f\n", n * m }'
    }

    ceil_gib() {
        awk -v b="$1" -v g="$GIB" 'BEGIN { printf "%.0f\n", int((b + g - 1) / g) }'
    }

    prom_query() {
        local query="$1"
        curl -fsS --max-time 20 -G "$PROMETHEUS_URL" --data-urlencode "query=$query"
    }

    declare -A USED_BYTES=()
    declare -A CAP_BYTES=()
    declare -A HEALTHY=()
    declare -A SIZES=()
    declare -A UPDATES=()
    declare -A SC_EXPANDABLE=()

    collect_metric() {
        local metric="$1" ns pvc value json
        if ! json="$(prom_query "max by (namespace, persistentvolumeclaim) ($metric)")"; then
            error "Prometheus query failed for $metric"
            return 1
        fi
        if ! jq -e '.status == "success" and (.data.result | type == "array")' >/dev/null 2>&1 <<<"$json"; then
            error "Prometheus returned an invalid response for $metric: $(jq -r '.error // "unknown error"' 2>/dev/null <<<"$json")"
            return 1
        fi
        while IFS=$'\x1f' read -r ns pvc value; do
            [[ -n "$ns" && -n "$pvc" && -n "$value" ]] || continue
            if [[ "$metric" == "kubelet_volume_stats_used_bytes" ]]; then
                USED_BYTES["$ns/$pvc"]="$value"
            else
                CAP_BYTES["$ns/$pvc"]="$value"
            fi
        done < <(jq -r '.data.result[]? | [.metric.namespace, .metric.persistentvolumeclaim, .value[1]] | map(tostring) | join("\u001f")' <<<"$json")
    }

    collect_healthy() {
        local ns pvc value json
        if ! json="$(prom_query 'min by (pvc_namespace, pvc) (longhorn_volume_robustness{state="healthy"})')"; then
            error "Prometheus query failed for longhorn_volume_robustness"
            return 1
        fi
        if ! jq -e '.status == "success" and (.data.result | type == "array")' >/dev/null 2>&1 <<<"$json"; then
            error "Prometheus returned an invalid response for longhorn_volume_robustness: $(jq -r '.error // "unknown error"' 2>/dev/null <<<"$json")"
            return 1
        fi
        while IFS=$'\x1f' read -r ns pvc value; do
            [[ -n "$ns" && -n "$pvc" && -n "$value" ]] || continue
            HEALTHY["$ns/$pvc"]="$value"
        done < <(jq -r '.data.result[]? | [.metric.pvc_namespace, .metric.pvc, .value[1]] | map(tostring) | join("\u001f")' <<<"$json")
    }

    collect_sizes() {
        local key value json
        if ! json="$(kubectl get configmap -n "$SIZES_CONFIGMAP_NAMESPACE" "$SIZES_CONFIGMAP_NAME" -o json)"; then
            error "failed to read ConfigMap $SIZES_CONFIGMAP_NAMESPACE/$SIZES_CONFIGMAP_NAME"
            return 1
        fi
        while IFS=$'\x1f' read -r key value; do
            [[ -n "$key" ]] || continue
            SIZES["$key"]="$value"
        done < <(jq -r '(.data // {}) | to_entries[] | [.key, .value] | map(tostring) | join("\u001f")' <<<"$json")
    }

    expandable() {
        local sc="$1" value
        if [[ -z "$sc" ]]; then
            return 1
        fi
        if [[ -z "${SC_EXPANDABLE[$sc]:-}" ]]; then
            if ! value="$(kubectl get storageclass "$sc" -o jsonpath='{.allowVolumeExpansion}' 2>/dev/null)"; then
                return 2
            fi
            SC_EXPANDABLE["$sc"]="${value:-false}"
        fi
        [[ "${SC_EXPANDABLE[$sc]}" == "true" ]]
    }

    collect_metric kubelet_volume_stats_used_bytes || exit 1
    collect_metric kubelet_volume_stats_capacity_bytes || exit 1
    collect_healthy || exit 1
    collect_sizes || exit 1

    if ! pvcs="$(kubectl get pvc -A -l "$LABEL_SELECTOR" -o json)"; then
        log "ERROR: failed to list PVCs with label $LABEL_SELECTOR"
        exit 1
    fi

    count=0
    while IFS=$'\x1f' read -r ns name request sc max_override var; do
        [[ -n "$ns" ]] || continue
        count=$((count + 1))
        key="$ns/$name"

        if [[ -z "$var" ]]; then
            log "$key: skipping, missing longhorn-autoresize/var annotation"
            continue
        fi

        if ! request_bytes="$(quantity_to_bytes "$request")"; then
            FAILED=1
            continue
        fi

        config_missing=0
        config_size="${SIZES[$var]:-}"
        if [[ -n "$config_size" ]]; then
            if ! config_bytes="$(quantity_to_bytes "$config_size")"; then
                FAILED=1
                continue
            fi
        else
            config_missing=1
            config_bytes="$request_bytes"
        fi

        if (( config_missing == 1 || config_bytes < request_bytes )); then
            UPDATES["$var"]="$request"
            if (( config_missing == 1 )); then
                log "$key: seeding $var=$request from live PVC request"
            else
                log "$key: raising $var=$request to match live PVC request (was $config_size)"
            fi
        fi

        if (( config_bytes > request_bytes )); then
            current_bytes="$config_bytes"
        else
            current_bytes="$request_bytes"
        fi

        used="${USED_BYTES[$key]:-}"
        capacity="${CAP_BYTES[$key]:-}"
        if [[ -z "$used" || -z "$capacity" ]]; then
            log "$key: skipping, no filesystem metrics (volume detached or not mounted)"
            continue
        fi

        if [[ "${HEALTHY[$key]:-0}" != "1" ]]; then
            log "$key: skipping, Longhorn volume is not healthy"
            continue
        fi

        pct="$(awk -v u="$used" -v c="$capacity" 'BEGIN {
            if (c <= 0) { print "0.0"; exit }
            printf "%.1f", 100 * u / c
        }')"

        if ! awk -v p="$pct" -v t="$THRESHOLD_PERCENT" 'BEGIN { exit !(p > t) }'; then
            log "$key: ${pct}% used, below ${THRESHOLD_PERCENT}%, no change"
            continue
        fi

        if [[ -n "$max_override" ]]; then
            max_label="$max_override"
            if ! max_bytes="$(quantity_to_bytes "$max_override")"; then
                FAILED=1
                continue
            fi
        else
            max_label="${MAX_SIZE_GIB}Gi"
            max_bytes=$((MAX_SIZE_GIB * GIB))
        fi

        if (( current_bytes >= max_bytes )); then
            log "$key: ${pct}% used but already at/above max size $max_label, skipping"
            continue
        fi

        expandable "$sc"
        sc_status=$?
        if (( sc_status == 2 )); then
            error "$key: failed to read StorageClass '$sc'"
            continue
        fi
        if (( sc_status != 0 )); then
            log "$key: ${pct}% used but StorageClass '$sc' does not allow volume expansion, skipping"
            continue
        fi

        if awk -v r="$current_bytes" -v c="$capacity" -v m="$MAX_OVERHEAD_RATIO" 'BEGIN { exit !((r / c) > m) }'; then
            log "$key: ${pct}% used but filesystem capacity has not caught up with target $var=$config_size, skipping"
            continue
        fi

        overhead="$(awk -v r="$current_bytes" -v c="$capacity" -v m="$MAX_OVERHEAD_RATIO" 'BEGIN {
            if (c <= 0) { print "1.0"; exit }
            x = r / c
            if (x < 1) x = 1
            if (x > m) x = m
            printf "%.4f", x
        }')"

        desired_bytes="$(awk -v u="$used" -v t="$TARGET_PERCENT" -v o="$overhead" 'BEGIN {
            printf "%.0f\n", (u / (t / 100)) * o
        }')"

        if ! desired_gib="$(ceil_gib "$desired_bytes")"; then
            FAILED=1
            continue
        fi
        desired_bytes=$((desired_gib * GIB))

        if (( desired_bytes > max_bytes )); then
            desired_bytes="$max_bytes"
            desired_gib=$((max_bytes / GIB))
            if (( desired_gib < 1 )); then
                desired_gib=1
            fi
            new_size="$max_label"
            log "$key: ${pct}% used; capping at max size $max_label, usage may remain above target"
        else
            new_size="${desired_gib}Gi"
        fi

        if (( desired_bytes <= current_bytes )); then
            log "$key: ${pct}% used but target $var=$config_size ($request requested) is already large enough, skipping"
            continue
        fi

        UPDATES["$var"]="$new_size"
        log "$key: ${pct}% used; requesting $var=$new_size (PVC request $request, ConfigMap ${config_size:-unset})"
    done < <(jq -r '.items[] | [
        .metadata.namespace,
        .metadata.name,
        .spec.resources.requests.storage,
        (.spec.storageClassName // ""),
        (.metadata.annotations["longhorn-autoresize/max-size"] // ""),
        (.metadata.annotations["longhorn-autoresize/var"] // "")
    ] | map(tostring) | join("\u001f")' <<<"$pvcs")

    log "processed $count labelled PVC(s)"

    if (( ${#UPDATES[@]} == 0 )); then
        log "no size changes requested"
        exit "$FAILED"
    fi

    if [[ "$DRY_RUN" == "true" ]]; then
        for var in "${!UPDATES[@]}"; do
            log "dry-run: would set $var=${UPDATES[$var]}"
        done
        exit "$FAILED"
    fi

    updates_json='{}'
    for var in "${!UPDATES[@]}"; do
        if ! updates_json="$(jq -c --arg key "$var" --arg value "${UPDATES[$var]}" '. + {($key): $value}' <<<"$updates_json")"; then
            error "failed to build ConfigMap patch"
            exit 1
        fi
    done

    if ! patch="$(jq -n --argjson data "$updates_json" '{data: $data}')"; then
        error "failed to build ConfigMap patch"
        exit 1
    fi

    if kubectl patch configmap -n "$SIZES_CONFIGMAP_NAMESPACE" "$SIZES_CONFIGMAP_NAME" --type=merge -p "$patch" >/dev/null; then
        for var in "${!UPDATES[@]}"; do
            log "set $var=${UPDATES[$var]}"
        done
        log "updated ConfigMap $SIZES_CONFIGMAP_NAMESPACE/$SIZES_CONFIGMAP_NAME; Flux will apply the new sizes"
    else
        error "failed to update ConfigMap $SIZES_CONFIGMAP_NAMESPACE/$SIZES_CONFIGMAP_NAME"
    fi

    exit "$FAILED"
