apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-autoresizer-sizes
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
  annotations:
    # Created from Git once; afterwards the volume-autoresizer CronJob owns the
    # size values and Flux must not overwrite them. If the object is deleted,
    # Flux recreates it with these initial sizes and the job restores live
    # sizes on its next run. Keys for removed PVCs must be deleted manually.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: Disabled
data:
  PVC_BEANS_LOBBY_SIZE: "20Gi"
  PVC_CHUNGUS_MINECRAFT_DATA_SIZE: "20Gi"
  PVC_GRAFANA_SIZE: "5Gi"
  PVC_IMMICH_DATA_SIZE: "150Gi"
  PVC_IMMICH_MEDIA_SIZE: "600Gi"
  PVC_IMMICH_POSTGRES_SIZE: "20Gi"
  PVC_OMADA_DATA_SIZE: "2Gi"
  PVC_OMADA_LOGS_SIZE: "1Gi"
