---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 29.35.0
  values:
    server:
      replicaCount: 1
      retention: 30d
      # Hard cap so the PVC can't fill up (50Gi volume).
      retentionSize: 45GB
      persistentVolume:
        enabled: true
        size: 50Gi
        # Metrics are disposable: keep them off the replicated longhorn volumes.
        # longhorn-ephemeral is 1 replica with the no-backup recurring-job group.
        storageClass: longhorn-ephemeral
      # Accept metrics from the Alloy collectors (and, later, from other
      # tailnet producers) via remote write.
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      alertmanagers:
        - static_configs:
            - targets:
                - prometheus-alertmanager:9093
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
    # Alerts are evaluated and routed to a null receiver until a real receiver
    # is configured.
    alertmanager:
      enabled: true
      persistence:
        enabled: true
        size: 2Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    # kube-state-metrics and node-exporter are deployed by the k8s-monitoring
    # chart; Alloy is the only scraper, so disable the bundled ones and the
    # default Kubernetes discovery scrape jobs.
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    scrapeConfigs:
      prometheus:
        enabled: true
      kubernetes-api-servers:
        enabled: false
      kubernetes-nodes:
        enabled: false
      kubernetes-nodes-cadvisor:
        enabled: false
      kubernetes-service-endpoints:
        enabled: false
      kubernetes-service-endpoints-slow:
        enabled: false
      prometheus-pushgateway:
        enabled: false
      kubernetes-services:
        enabled: false
      kubernetes-pods:
        enabled: false
      kubernetes-pods-slow:
        enabled: false
    # Scrape the Raspberry Pi's exporters through the Tailscale egress proxy
    # (pi-metrics service). These are the only non-Kubernetes scrape targets.
    extraScrapeConfigs: |
      - job_name: raspberrypi-node
        static_configs:
          - targets:
              - pi-metrics.tailscale.svc.cluster.local:9100
            labels:
              instance: raspberrypi
      - job_name: raspberrypi-smart
        static_configs:
          - targets:
              - pi-metrics.tailscale.svc.cluster.local:9633
            labels:
              instance: raspberrypi
    # Alerting rules. Alertmanager currently routes to a null receiver, so these
    # evaluate and show in the UIs but do not notify anywhere yet.
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: raspberrypi
            rules:
              - alert: RaspberryPiNodeExporterDown
                expr: up{job="raspberrypi-node"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Raspberry Pi node-exporter is unreachable"
                  description: "Prometheus has failed to scrape pi-metrics:9100 for 10m. The Pi, tailscaled, node_exporter or the egress proxy may be down."
              - alert: RaspberryPiSmartctlExporterDown
                expr: up{job="raspberrypi-smart"} == 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Raspberry Pi smartctl-exporter is unreachable"
                  description: "Prometheus has failed to scrape pi-metrics:9633 for 15m. SMART monitoring is blind."
              - alert: SmartDeviceUnhealthy
                expr: smartctl_device_smart_status == 0
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "SMART health FAILED on {{ $labels.device }} (raspberrypi)"
                  description: "smartctl reports the overall-health self-assessment as failing."
              - alert: SmartctlExitStatusUnhealthy
                expr: smartctl_device_smartctl_exit_status != 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "smartctl reported an issue on {{ $labels.device }} (raspberrypi)"
                  description: "smartctl exit status is {{ $value }}."
              - alert: SmartTemperatureHigh
                expr: smartctl_device_temperature{temperature_type="current"} > 45
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Disk temperature high on {{ $labels.device }} (raspberrypi)"
                  description: "Drive temperature has been {{ $value }}C for 30m."
              - alert: SmartMediaErrors
                expr: delta(smartctl_device_media_errors[6h]) > 0
                labels:
                  severity: critical
                annotations:
                  summary: "New media errors on {{ $labels.device }} (raspberrypi)"
                  description: "smartctl media_errors increased in the last 6h."
          # Longhorn storage health. Degraded/rebuilding volumes and
          # non-schedulable disks are the warning signs that preceded real
          # filesystem/DB corruption during node reboots — do not restart a
          # node while any of these are firing.
          - name: longhorn
            rules:
              - alert: LonghornVolumeFaulted
                expr: longhorn_volume_robustness{state="faulted"} == 1
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Longhorn volume faulted: {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
                  description: "Volume {{ $labels.volume }} on {{ $labels.node }} is faulted - data is at risk. Do not do anything else until inspected."
              - alert: LonghornVolumeDegraded
                expr: longhorn_volume_robustness{state="degraded"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Longhorn volume degraded: {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
                  description: "Volume {{ $labels.volume }} has lost redundancy (replica rebuilding/down). Do NOT restart another node until it is healthy again."
              - alert: LonghornVolumeUnknown
                # Detached volumes always report robustness "unknown", so exclude
                # them; only an attached volume with unknown robustness is noise-worthy.
                expr: longhorn_volume_robustness{state="unknown"} == 1 unless on(volume) longhorn_volume_state{state="detached"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Longhorn volume robustness unknown: {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
                  description: "Volume {{ $labels.volume }} on {{ $labels.node }} has an unknown robustness state."
              - alert: LonghornReplicaError
                expr: longhorn_replica_state{state="error"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Longhorn replica in error state on {{ $labels.node }}"
                  description: "Replica {{ $labels.replica }} for volume {{ $labels.volume }} has been in error for 15m."
              - alert: LonghornEngineError
                expr: longhorn_engine_state{state="error"} == 1
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Longhorn engine in error state on {{ $labels.node }}"
                  description: "Engine for volume {{ $labels.volume }} has been in error for 10m."
              - alert: LonghornRebuildInProgress
                expr: longhorn_engine_rebuild_progress > 0
                for: 10m
                labels:
                  severity: info
                annotations:
                  summary: "Longhorn replica rebuilding for {{ $labels.volume }}"
                  description: "A replica rebuild has been running for 10m; storage is at reduced redundancy. Avoid node restarts."
              - alert: LonghornNodeNotReady
                expr: longhorn_node_status{condition="ready"} == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Longhorn node {{ $labels.node }} not ready"
                  description: "Longhorn reports node {{ $labels.node }} as not ready."
              - alert: LonghornDiskNotSchedulable
                expr: longhorn_disk_status{condition="schedulable"} == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} not schedulable"
                  description: "Disk is full/over-provisioned, so new replicas and rebuilds cannot be placed here. This is how volumes get stuck degraded."
              - alert: LonghornDiskSpaceHigh
                expr: longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.85
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is >85% full"
                  description: "Low free space risks failed rebuilds and DiskPressure."
              - alert: LonghornDiskHealthFailing
                expr: longhorn_disk_health == 0
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} reports failing health"
                  description: "Longhorn's disk health check is failing - investigate the underlying drive."
              - alert: LonghornBackupStale
                # last_backup_at is 0 for volumes that were never backed up (e.g.
                # the longhorn-ephemeral no-backup group), which would otherwise
                # always be stale by definition.
                expr: time() - longhorn_volume_last_backup_at > 3 * 24 * 3600 and longhorn_volume_last_backup_at > 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "No recent Longhorn backup for {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
                  description: "Last backup was over 3 days ago. Backups are the last line of defence against storage corruption."
          # Kubernetes-level storage/cluster health.
          - name: storage
            rules:
              - alert: KubeNodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "Kubernetes node {{ $labels.node }} NotReady for 10m"
                  description: "Workloads and Longhorn replicas on {{ $labels.node }} are unavailable."
              - alert: KubeNodeDiskPressure
                expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} under DiskPressure"
                  description: "The node is running low on disk; kubelet may evict pods."
              - alert: PersistentVolumeFailed
                expr: kube_persistentvolume_status_phase{phase="Failed"} == 1
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "PersistentVolume {{ $labels.persistentvolume }} is Failed"
              - alert: PersistentVolumeClaimLost
                expr: kube_persistentvolumeclaim_status_phase{phase="Lost"} == 1
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is Lost"
                  description: "The PVC's bound volume is gone; the workload's data may be unavailable."
              - alert: PodStuckPending
                expr: kube_pod_status_phase{phase="Pending"} == 1
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending for 30m"
                  description: "Often a volume attach/mount failure (e.g. a failed fsck after an unclean shutdown)."
              - alert: VolumeNearlyFull
                expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Volume nearly full: {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
                  description: "Filesystem is {{ $value | humanizePercentage }} full on node {{ $labels.node }}."
              - alert: VolumeAlmostFull
                expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.95
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Volume almost full: {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
                  description: "Filesystem is {{ $value | humanizePercentage }} full on node {{ $labels.node }} - expand the PVC or free space now."
---
# Tailnet-only access to Alertmanager: https://alertmanager.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: prometheus-alertmanager
      port:
        number: 9093
  tls:
    - hosts:
        - alertmanager
