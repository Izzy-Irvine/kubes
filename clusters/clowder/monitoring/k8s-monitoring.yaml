---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 10m
  dependsOn:
    - name: prometheus
    - name: loki
    - name: prometheus-operator-crds
  chart:
    spec:
      chart: k8s-monitoring
      sourceRef:
        kind: HelmRepository
        name: grafana
      version: 4.5.2
  values:
    cluster:
      name: clowder
    destinations:
      localPrometheus:
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
      localLoki:
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      # The API server scrape is off by default; enable it for apiserver_*.
      apiServer:
        enabled: true
      # Forward the full cAdvisor and kube-state-metrics metric sets. The
      # minimal default allow lists omit throttling/OOM/network-error and
      # many kube_* metrics used by the Kubernetes dashboards.
      cadvisor:
        metricsTuning:
          useDefaultAllowList: false
      kube-state-metrics:
        metricsTuning:
          useDefaultAllowList: false
    hostMetrics:
      enabled: true
      collector: alloy-metrics
      linuxHosts:
        enabled: true
        # Forward the full Node Exporter metric set. The default allow list is
        # tiny and omits node_uname_info (used by dashboard variables) plus
        # node_time_seconds, hwmon, PSI, schedstat and more.
        metricsTuning:
          useDefaultAllowList: false
      windowsHosts:
        enabled: false
    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
    clusterEvents:
      enabled: true
      collector: alloy-singleton
    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
    collectors:
      alloy-metrics:
        presets: [medium, clustered, statefulset]
      alloy-logs:
        presets: [small, filesystem-log-reader, daemonset]
      alloy-singleton:
        presets: [small, deployment]
    telemetryServices:
      kube-state-metrics:
        deploy: true
        # KSM only emits the kube_<resource>_labels metrics for resources in
        # this allow list; the dashboards' "Kubernetes Resource Count" panel
        # uses them. The node entries preserve the chart default.
        metricLabelsAllowlist:
          - nodes=[agentpool,alpha.eksctl.io/cluster-name,alpha.eksctl.io/nodegroup-name,beta.kubernetes.io/instance-type,cloud.google.com/gke-nodepool,cluster-name,ec2.amazonaws.com/Name,ec2.amazonaws.com/aws-autoscaling-groupName,ec2.amazonaws.com/aws-autoscaling-group-name,ec2.amazonaws.com/name,eks.amazonaws.com/nodegroup,k8s.io/cloud-provider-aws,karpenter.sh/nodepool,kubernetes.azure.com/cluster,kubernetes.io/arch,kubernetes.io/hostname,kubernetes.io/os,node.kubernetes.io/instance-type,topology.kubernetes.io/region,topology.kubernetes.io/zone]
          - daemonsets=[app.kubernetes.io/name]
          - deployments=[app.kubernetes.io/name]
          - horizontalpodautoscalers=[app.kubernetes.io/name]
          - namespaces=[app.kubernetes.io/name]
          - networkpolicies=[app.kubernetes.io/name]
          - statefulsets=[app.kubernetes.io/name]
      node-exporter:
        deploy: true
      windows-exporter:
        deploy: false
    selfReporting:
      enabled: false
